---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Run demo
        run: swift run demo

      - name: Validate Metal shaders
        run: swift hack/validate_metal.swift

      - name: Check code formatting
        run: |
          if command -v swiftformat &> /dev/null; then
            swiftformat --lint .
          else
            echo "SwiftFormat not available, skipping"
          fi
